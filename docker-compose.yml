services:
  ecommerce-store:
    build: .
    container_name: aiops-tech-store
    ports:
      - "80:80"
    restart: always

  payment-gateway:
    build: .
    container_name: aiops-payment-gateway
    ports:
      - "5000:5000"
    restart: always

  auto-healer:
    build: .
    container_name: aiops-auto-healer
    restart: always

  security-monitor:
    build: .
    container_name: aiops-security-monitor
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: aiops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: aiops-grafana
    ports:
      - "3000:3000"
    restart: always
  nginx:
    image: nginx:latest
    container_name: aiops-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: always
